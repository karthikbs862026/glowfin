name: version41-autostart-race-fix

on:
  push:
    branches: [agent/version41-living-current]

permissions:
  contents: write

jobs:
  fix-autostart-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version41-living-current
          fetch-depth: 0
      - name: Wait for the wired Moon Well before deep-link auto-start
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/engagement/version41Micro.ts")
          text = source.read_text(encoding="utf-8")
          old = '''  if (queryStart || rematch) setTimeout(start, 0);
          '''
          new = '''  if (queryStart || rematch) {
            let attempts = 0;
            const autoStart = (): void => {
              const hub = element("moonwell-hub");
              if (
                document.documentElement.dataset["glowfinRuntime"] === "running" &&
                hub?.dataset["active"] === "true"
              ) {
                start();
                return;
              }
              attempts += 1;
              if (attempts < 200) setTimeout(autoStart, 50);
            };
            setTimeout(autoStart, 0);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one exact auto-start statement, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/version41-autostart-race-fix.yml").unlink()
      - name: Commit the correction and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engagement/version41Micro.ts .github/workflows/version41-autostart-race-fix.yml
          git commit -m "Version 41: wait for the wired hub before auto-start"
          git push origin HEAD:agent/version41-living-current
