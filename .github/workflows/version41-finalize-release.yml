name: version41-finalize-release

on:
  push:
    branches: [agent/version41-living-current]

permissions:
  contents: write

concurrency:
  group: version41-finalize-release
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version41-living-current
          fetch-depth: 0
      - name: Apply final Version 41 runtime and QA corrections
        run: python scripts/finalize-v41-release.py
      - name: Commit corrected runtime and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Finalizer produced no changes" >&2
            exit 1
          fi
          git commit -m "fix: publish the Version 41 Expedition safely"
          git push origin HEAD:agent/version41-living-current
