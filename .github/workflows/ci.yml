name: CI

# Part 6.2 — Every commit / PR: lint, type-check, the complete unit,
# integration, deterministic simulation and solvability suite, production
# build, mounted-path/release checks, bundle budget, debug stripping and secret
# scan. Render, touch-audio and lifecycle evidence runs in art-gate.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck-test-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          GLOWFIN_ENVIRONMENT: staging
          GLOWFIN_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build hosted anti-cheat authority
        run: npm run build:hosted-verifier

      - name: Verify hosted anti-cheat authority
        run: npm run check:hosted-verifier

      - name: Hosted mount safety check
        run: npm run check:mounted-build

      - name: Bundle size check
        run: npm run check:bundle-size

      - name: Debug tooling strip check
        run: npm run check:no-debug

      - name: Release identity check
        run: npm run check:release-metadata
        env:
          GLOWFIN_EXPECTED_ENVIRONMENT: staging
          GLOWFIN_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: glowfin-release-metadata-${{ github.sha }}
          path: |
            dist/release.json
            build/hosted/glowfin-verifier.js
            build/hosted/glowfin-verifier.js.map
