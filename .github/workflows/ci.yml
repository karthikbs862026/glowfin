name: CI

# Part 6.2 — Every commit / PR: lint, type-check, unit tests, build,
# bundle-size check, secret scan. Integration tests + headless simulation +
# visual regression + perf budget are added in later phases as those
# systems exist (Part 6.1) — this file grows with the project, it doesn't
# ship complete on day one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck-test-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run check:bundle-size

  # Placeholder — wired up in Phase 1 once the movement/control test suite
  # (Part 6.4) exists. Left here so the CI shape is visible from Phase 0.
  # integration-and-simulation:
  #   name: Integration + headless simulation
  #   runs-on: ubuntu-latest
  #   needs: lint-typecheck-test-build
  #   steps:
  #     - run: echo "Added in Phase 1 — see Part 6.4 and 6.6"
