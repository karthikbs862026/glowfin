name: version41-clock-fix

on:
  push:
    branches: [agent/version41-living-current]

permissions:
  contents: write

concurrency:
  group: version41-clock-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version41-living-current
          fetch-depth: 0
      - name: Apply the audited active-clock correction
        run: python scripts/fix-v41-active-clock.py
      - name: Commit correction and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep the Version 41 Expedition on active wall time"
          git push origin HEAD:agent/version41-living-current
