name: version41-live-smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted-mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GLOWFIN_LIVE_URL: https://glowfin-phase-3b.karthik-bs86.chatgpt.site/
      GLOWFIN_EXPECTED_COMMIT: c14c7b74ba4b00e574b6e4a99b8ed345225e265b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify live release, Moon Well entry and both Expedition starts
        run: |
          mkdir -p build/live-v41
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { chromium } from "playwright";

          const base = process.env.GLOWFIN_LIVE_URL;
          const expectedCommit = process.env.GLOWFIN_EXPECTED_COMMIT;
          const report = {
            base,
            expectedCommit,
            checkedAt: new Date().toISOString(),
            release: null,
            home: null,
            manualStart: null,
            directStart: null,
            issues: []
          };
          const browser = await chromium.launch({ headless: true });
          try {
            const releaseResponse = await fetch(new URL(`release.json?live-smoke=${Date.now()}`, base), {
              cache: "no-store",
              signal: AbortSignal.timeout(30_000)
            });
            report.release = releaseResponse.ok ? await releaseResponse.json() : {
              httpStatus: releaseResponse.status
            };
            if (!releaseResponse.ok) report.issues.push(`release.json returned ${releaseResponse.status}`);
            if (report.release?.version !== 41) report.issues.push(`live version is ${report.release?.version ?? "missing"}, expected 41`);
            if (report.release?.sourceCommit !== expectedCommit) {
              report.issues.push(`live source is ${report.release?.sourceCommit ?? "missing"}, expected ${expectedCommit}`);
            }

            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true
            });
            const page = await context.newPage();
            const errors = [];
            page.on("pageerror", (error) => errors.push(`page error: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") errors.push(`console error: ${message.text()}`);
            });
            const homeUrl = new URL(base);
            homeUrl.searchParams.set("live-smoke", String(Date.now()));
            await page.goto(homeUrl.toString(), { waitUntil: "domcontentloaded", timeout: 90_000 });
            await page.locator("#glowfin-canvas").waitFor({ state: "visible", timeout: 60_000 });
            await page.locator("#v41-entry").waitFor({ state: "visible", timeout: 60_000 });
            await page.waitForFunction(() => (
              document.documentElement.dataset.glowfinRuntime === "running" &&
              document.querySelector("#moonwell-hub")?.getAttribute("data-active") === "true"
            ), undefined, { timeout: 60_000 });
            report.home = await page.evaluate(() => ({
              entryVisible: getComputedStyle(document.querySelector("#v41-entry")).display !== "none",
              entryText: document.querySelector("#v41-entry")?.textContent?.replace(/\s+/g, " ").trim() ?? null,
              buildBadge: document.querySelector("#hud-build")?.textContent ?? null,
              runtime: document.documentElement.dataset.glowfinRuntime ?? null,
              startupError: document.body.dataset.startupError === "true"
            }));
            await page.screenshot({ path: "build/live-v41/01-home.png", fullPage: true });

            await page.locator("#v41-entry").tap();
            await page.waitForFunction(() => (
              document.querySelector("#v41-hud")?.getAttribute("data-active") === "true" &&
              (document.querySelector("#v41-hud")?.getAttribute("data-segment-history") ?? "")
                .split("|")
                .includes("follow-light")
            ), undefined, { timeout: 60_000 });
            report.manualStart = await page.evaluate(() => ({
              mode: document.documentElement.dataset.glowfinMode ?? null,
              segment: document.querySelector("#v41-hud")?.getAttribute("data-segment") ?? null,
              title: document.querySelector("#v41-segment-title")?.textContent ?? null,
              objective: document.querySelector("#v41-objective")?.textContent ?? null,
              hudActive: document.querySelector("#v41-hud")?.getAttribute("data-active") === "true",
              corePostRunVisible: getComputedStyle(document.querySelector("#hud-gameover")).display !== "none"
            }));
            await page.screenshot({ path: "build/live-v41/02-manual-start.png", fullPage: true });
            await context.close();

            const directContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true
            });
            const directPage = await directContext.newPage();
            const directUrl = new URL(base);
            directUrl.searchParams.set("expedition", "missing-moonseed");
            directUrl.searchParams.set("live-smoke", String(Date.now()));
            await directPage.goto(directUrl.toString(), { waitUntil: "domcontentloaded", timeout: 90_000 });
            await directPage.waitForFunction(() => (
              document.documentElement.dataset.glowfinV41AutoStart === "started" &&
              (document.querySelector("#v41-hud")?.getAttribute("data-segment-history") ?? "")
                .split("|")
                .includes("follow-light")
            ), undefined, { timeout: 90_000 });
            report.directStart = await directPage.evaluate(() => ({
              autoStart: document.documentElement.dataset.glowfinV41AutoStart ?? null,
              mode: document.documentElement.dataset.glowfinMode ?? null,
              segment: document.querySelector("#v41-hud")?.getAttribute("data-segment") ?? null,
              title: document.querySelector("#v41-segment-title")?.textContent ?? null,
              hudActive: document.querySelector("#v41-hud")?.getAttribute("data-active") === "true",
              startupError: document.body.dataset.startupError === "true"
            }));
            await directPage.screenshot({ path: "build/live-v41/03-direct-start.png", fullPage: true });
            await directContext.close();

            if (!report.home?.entryVisible || !/Missing Moonseed/i.test(report.home?.entryText ?? "")) {
              report.issues.push("The Missing Moonseed card is not visibly present on the live Moon Well");
            }
            if (report.home?.runtime !== "running" || report.home?.startupError) {
              report.issues.push("live home runtime did not reach a clean running state");
            }
            if (report.manualStart?.mode !== "expedition-v41" || !report.manualStart?.hudActive) {
              report.issues.push("manual Version 41 entry did not start the Expedition");
            }
            if (report.directStart?.autoStart !== "started" || report.directStart?.mode !== "expedition-v41" || !report.directStart?.hudActive) {
              report.issues.push("direct Version 41 link did not auto-start the Expedition");
            }
            if (errors.length) report.issues.push(...errors);
          } catch (error) {
            report.issues.push(error instanceof Error ? `${error.name}: ${error.message}` : String(error));
          } finally {
            await browser.close();
            writeFileSync("build/live-v41/report.json", `${JSON.stringify(report, null, 2)}\n`);
          }
          console.log(JSON.stringify(report, null, 2));
          if (report.issues.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version41-live-smoke-evidence
          path: build/live-v41
          retention-days: 7
