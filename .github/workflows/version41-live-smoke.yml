name: version41-main-release-status

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect-main-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: 8402cd3f34abe7b3fbbafe9ed7dc178ad3f15438
      RELEASE_TAG: glowfin-v41
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Poll main workflow runs and immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-status
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100" \
              > release-status/runs.json

            node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('release-status/runs.json', 'utf8'));
          const rows = payload.workflow_runs.map((run) => ({
            id: run.id,
            name: run.name,
            event: run.event,
            branch: run.head_branch,
            status: run.status,
            conclusion: run.conclusion,
            createdAt: run.created_at,
            updatedAt: run.updated_at,
            url: run.html_url
          }));
          fs.writeFileSync('release-status/summary.json', JSON.stringify({ total: rows.length, rows }, null, 2));
          console.log(JSON.stringify(rows, null, 2));
          NODE

            complete="$(node -e '
              const p=require("./release-status/runs.json");
              const names=new Set(["CI","production-readiness","native-wrapper","art-gate"]);
              const rows=p.workflow_runs.filter(r=>r.event==="push" && names.has(r.name));
              const allPresent=names.size===new Set(rows.map(r=>r.name)).size;
              const allDone=allPresent && rows.every(r=>r.status==="completed");
              const allGreen=allDone && rows.every(r=>r.conclusion==="success");
              process.stdout.write(allGreen ? "green" : allDone ? "failed" : "running");
            ')"

            tag_status="$(curl --silent --output release-status/tag.json --write-out '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/git/ref/tags/${RELEASE_TAG}")"
            echo "attempt=${attempt} workflow_state=${complete} tag_http=${tag_status}"

            if [[ "${complete}" == "failed" ]]; then
              echo "A required main workflow failed." >&2
              exit 1
            fi
            if [[ "${complete}" == "green" && "${tag_status}" == "200" ]]; then
              cat release-status/tag.json
              exit 0
            fi
            sleep 15
          done
          echo "Main release pipeline or tag did not complete inside the bounded inspection window." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version41-main-release-status
          path: release-status
          retention-days: 7
