name: version41-segment-invariant-fix

on:
  push:
    branches: [agent/version41-living-current]

permissions:
  contents: write

jobs:
  fix-segment-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version41-living-current
          fetch-depth: 0
      - name: Apply exact reviewed TypeScript correction
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/engagement/version41Micro.ts")
          text = source.read_text(encoding="utf-8")
          old = '''function segmentAt(time: number) {
            return S.find((segment) => time >= segment.startSec && time < segment.endSec) ?? S[S.length - 1];
          }
          '''
          new = '''function segmentAt(time: number): typeof S[number] {
            const segment = S.find((entry) => time >= entry.startSec && time < entry.endSec) ?? S[S.length - 1];
            if (!segment) throw new Error("Version 41 encounter plan is empty.");
            return segment;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one exact segmentAt block, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/version41-segment-invariant-fix.yml").unlink()
      - name: Commit the correction and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engagement/version41Micro.ts .github/workflows/version41-segment-invariant-fix.yml
          git commit -m "Version 41: fail closed on an empty encounter plan"
          git push origin HEAD:agent/version41-living-current
