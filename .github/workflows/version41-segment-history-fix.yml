name: version41-segment-history-fix

on:
  push:
    branches: [agent/version41-living-current]

permissions:
  contents: write

jobs:
  add-segment-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version41-living-current
          fetch-depth: 0
      - name: Record every deterministic encounter transition
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/engagement/version41Micro.ts")
          text = source.read_text(encoding="utf-8")
          old = '''  hud.dataset.segment = kind;
            hud.dataset.state = "active";
          '''
          new = '''  hud.dataset.segment = kind;
            const history = (hud.dataset["segmentHistory"] ?? "").split("|").filter(Boolean);
            if (history[history.length - 1] !== kind) history.push(kind);
            hud.dataset["segmentHistory"] = history.join("|");
            hud.dataset.state = "active";
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one exact segment assignment, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/version41-segment-history-fix.yml").unlink()
      - name: Commit the correction and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engagement/version41Micro.ts .github/workflows/version41-segment-history-fix.yml
          git commit -m "Version 41: expose ordered encounter history to QA"
          git push origin HEAD:agent/version41-living-current
